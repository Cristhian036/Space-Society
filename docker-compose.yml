version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: space_society_api
    restart: unless-stopped
    environment:
      - PORT=8050
      - PYTHONUNBUFFERED=1
    volumes:
      - dem_cache:/app/.dem_cache
    networks:
      - app_network

  web:
    image: nginx:alpine
    container_name: space_society_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app_network

volumes:
  dem_cache:

networks:
  app_network:
    driver: bridge
